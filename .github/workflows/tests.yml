name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    name: Python tests (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run core tests and save results
        run: |
          python -m pytest tests/test_v3.py tests/test_v4.py -v --junitxml=test-results.xml
      - name: Validate screenshots, PDFs, CAD files and documentation
        run: |
          python -m pip install "Pillow>=10,<13" "pypdf>=5,<7"
          python scripts/verify_repo_assets.py
      - name: Check JavaScript syntax
        run: node --check static/v4.js
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: test-results.xml
          if-no-files-found: warn
